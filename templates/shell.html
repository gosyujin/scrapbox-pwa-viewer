<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{{TITLE}}</title>
<meta name="scrapbox-exported-at" content="{{EXPORTED_AT}}">
<meta name="build-commit" content="{{BUILD_COMMIT}}">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<style>
{{STYLE}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-top">
      <div id="data-version">データ取得: {{EXPORTED_AT}} ／ ビルド: {{BUILD_COMMIT}}</div>
      <div id="top-controls">
        <button id="brand-link" class="brand" title="トップページ">{{TITLE}}</button>
        <button id="home-btn" aria-label="トップページ" title="トップページ">&#9750;</button>
        <button id="update-btn" aria-label="最新データを確認" title="最新データを確認">&#8635;</button>
        <input id="search-box" type="text" placeholder="検索 (/)" autocomplete="off">
        <button id="random-btn" aria-label="ランダムなページ" title="ランダムなページ">&#127922;</button>
      </div>
    </div>
    <div id="list-view">
      <div id="notes-bar">
        <span id="notes-count"></span>
        <button id="notes-copy-btn">メモを全部コピー</button>
        <button id="notes-clear-btn" title="保存済みメモを全削除">クリア</button>
      </div>
      <div id="global-note-mobile-slot" class="global-note">
        <textarea id="global-note-mobile" placeholder="作業用メモ（この端末にのみ保存）"></textarea>
      </div>
      <div id="sort-bar">
        <label for="sort-select">並び替え</label>
        <select id="sort-select">
          <option value="modified" selected>更新日時</option>
          <option value="created">作成日時</option>
          <option value="lastVisited">最終閲覧（この端末）</option>
          <option value="linked">被リンク数</option>
          <option value="viewed">閲覧数</option>
          <option value="cache">メモ優先</option>
        </select>
      </div>
      <div id="search-meta"></div>
      <div id="page-list"></div>
    </div>
  </div>
  <div class="content-view">
    <div id="main"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="notes-fallback" class="modal-overlay hidden">
  <div class="modal-box">
    <p>クリップボードに自動コピーできませんでした。下のテキストを全選択してコピーしてください。</p>
    <textarea id="notes-fallback-text" readonly></textarea>
    <button id="notes-fallback-close">閉じる</button>
  </div>
</div>
<script type="application/json" id="sb-data">{{DATA_JSON}}</script>
<script>
{{APP_JS}}
</script>
</body>
</html>
